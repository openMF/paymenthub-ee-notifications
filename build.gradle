/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java'
    id 'maven-publish'
    id 'eclipse'
    id 'idea'
    id 'org.springframework.boot' version '3.4.4'
    id 'io.spring.dependency-management' version '1.1.6'
}

repositories {
    maven {
        url = uri('https://repo.maven.apache.org/maven2/')
    }
    // paymenthub-ee-bom and paymenthub-ee-core 2.0.0-SNAPSHOT live on the
    // official Mifos JFrog. The old fyn-libs-snapshot repo is gone: it only
    // served ph-ee-connector-common 1.x.
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/phee-gradle-local')
    }
    maven {
        url = uri('https://mifos.jfrog.io/artifactory/mifosx-gradle-local')
    }
    mavenCentral()
}

// Camel asks for the old JAXB RI coordinates (com.sun.xml.bind:jaxb-impl, which
// drags in com.sun.xml.bind:jaxb-core), Hibernate for the current ones
// (org.glassfish.jaxb:jaxb-runtime -> org.glassfish.jaxb:jaxb-core). Both ship a
// file named jaxb-core-4.0.5.jar, and a boot jar has one flat BOOT-INF/lib, so one
// would silently overwrite the other and take its classes with it. The two halves
// never shared a classpath before they were merged into one application. The
// current RI is kept and the old coordinates are dropped; JAXBContext resolves
// against whichever implementation is on the classpath.
configurations.all {
    exclude group: 'com.sun.xml.bind', module: 'jaxb-core'
    exclude group: 'com.sun.xml.bind', module: 'jaxb-impl'
}

dependencies {
    // Mifos Platform BOM pins Spring Boot 3.4, Camel 4, Zeebe 8, Jakarta EE 10
    // and every other shared library version. Do NOT hardcode managed versions.
    // This is a deployable application (leaf node), so use enforcedPlatform().
    implementation enforcedPlatform('org.mifos:paymenthub-ee-bom:2.0.0-SNAPSHOT')

    implementation 'org.mifos:paymenthub-ee-core:2.0.0-SNAPSHOT'

    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // The message gateway half owns the messagegateway schema.
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    // Flyway 10 (required by Spring Boot 3.4) moved per-database support out of
    // flyway-core into its own module. The migrations in db/migration are MySQL.
    implementation 'org.flywaydb:flyway-mysql'
    runtimeOnly 'com.mysql:mysql-connector-j'

    implementation 'org.apache.camel.springboot:camel-spring-boot-starter'
    implementation 'org.apache.camel.springboot:camel-jackson-starter'
    implementation 'org.apache.camel:camel-endpointdsl'
    implementation 'org.apache.camel:camel-jetty'
    implementation 'org.apache.camel:camel-undertow'
    implementation 'org.apache.camel:camel-http'
    implementation 'io.camunda:zeebe-client-java'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'org.json:json'
    implementation 'com.google.code.gson:gson'
    implementation 'com.auth0:java-jwt'
    // Three gateway helper classes use StringUtils. It used to arrive transitively
    // as commons-lang 2.x (last released 2011) via velocity, which nothing else
    // uses. Declared directly as commons-lang3 instead.
    implementation 'org.apache.commons:commons-lang3'
    // okhttp is imported directly by JasminSMSProvider and CallbackEventListner.
    // It keeps its resolved 2.3.0: the BOM does not manage it, and moving to
    // okhttp3 is a source change.
    implementation 'com.squareup.okhttp:okhttp:2.3.0'
    // Velocity renders the message templates. Not managed by the BOM.
    implementation 'org.apache.velocity:velocity:1.7'

    // SMS provider SDKs: not managed by the BOM, so these keep explicit versions.
    implementation 'com.twilio.sdk:twilio:7.1.0'
    implementation 'com.infobip:infobip-api-java-client:2.0.0'
    implementation 'com.telerivet:TelerivetAPIClient:1.7.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine'
    // The context test starts the whole application, gateway half included, so it
    // needs a database. H2 stands in for MySQL; the real schema comes from Flyway
    // at runtime, so the test creates it from the entities instead.
    testRuntimeOnly 'com.h2database:h2'
}

group = 'org.mifos'
version = '2.0.0.mifos-SNAPSHOT'

java {
    // The toolchain, not the JDK that happens to launch Gradle, decides the
    // compiler. Gradle provisions a JDK 21 if the local one is older.
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    // The contextLoads() smoke test is JUnit 5; without this Gradle looks for
    // JUnit 4 tests, finds none, and reports :test as passed.
    useJUnitPlatform()
}

// Fixed jar name so the Dockerfile can copy the boot jar by name. `gradlew build`
// also produces a -plain.jar, which has no main class.
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
